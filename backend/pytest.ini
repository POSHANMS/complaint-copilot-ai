[pytest]
testpaths = tests
addopts = -v --tb=short
markers =
    unit: Unit tests with all external calls mocked (fast, no network)
    integration: Integration tests (Groq mocked, DB may be real)
    regression: Regression tests ensuring previously-fixed bugs don't recur
    live_api: Tests that hit the real Groq API (slow, network-required, skip in CI)
